<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>El Trecho Justo</title>
        <meta name="description" content="Juego familiar donde estimar distancias entre ciudades.">

        <!-- Estilos -->
        <link rel="stylesheet" href="assets/css/bootstrap.min.css">
        <link rel="stylesheet" href="assets/css/styles.css?v=1.1">
        
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="assets/icon/favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png">
        <link rel="manifest" href="assets/icon/site.webmanifest">
        
    </head>

    <body>

        <div class="contenedor">

            <h3 class="text-repartido text-center mb-3">🌎 El Trecho Justo 🌍</h3>
            <p class="text-repartido text-center mb-3">¡Estimen la distancia entre dos ciudades! 📏 La que volaría un dron en línea recta.</p>
            <h3 class="text-repartido text-center mb-3">
                ¿Cuántos kilómetros hay entre <span id="ciudadA" class="ciudad"></span>
                 y <span id="ciudadB" class="ciudad"></span>?
            </h3>

            <div class="jugadores" id="panelJugadores"></div>

            <div class="paneles">                
                <div id="cuadroResultado" class="deshabilitado"></div>                

                <button class="boton" id="botonRespuesta">
                    VER LA DISTANCIA 📐
                </button>

                <button class="boton" id="botonPregunta">
                    NUEVA PREGUNTA 🗺
                </button>
            </div>

        </div>

        <dialog id="dialogoAvisos" class="cuadroDialogo">
            <h3>Atención:</h3>
            <p id="textoAviso"></p>
            <button class="boton" id="botonContinuar">CONTINUAR</button>
        </dialog>

        <dialog id="dialogoNumJugadores" class="cuadroDialogo">
            <h3 class="text-repartido text-center mb-3">🌎 El Trecho Justo 🌍</h3>
            <h5 class="text-repartido mb-3">Indique el número de jugadores:</h5>
            <input type="number" id="inputNumJugadores" class="mb-3" placeholder="Inserte un número del 2 al 16" min="2" max="16">
            <button class="boton" id="botonConfirmar">CONFIRMAR</button>
        </dialog>

        <script src="assets/js/datos-ciudades.js"></script>
        <script src="assets/js/app.js?v=1.1"></script>

    </body>

</html>
